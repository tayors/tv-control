<div class="picture-navigation"><button class="back" data-view="remote">${icon('left')}Remote</button><span class="refresh-status" role="status"></span><button class="tool picture-refresh" title="Refresh picture status" aria-label="Refresh picture status">${icon('refresh')}</button></div>
<h1>Picture comfort</h1>
<div class="scroll picture-scroll">
<div class="comfort-state"><h2 class="picture-title">Keep this picture?</h2><p class="picture-detail">Your last adjustment stays in place while you decide.</p></div>

<section class="reuse-section"><div class="automatic-row"><div><h2>Automatic adjustments</h2><p class="automatic-copy">On · confirmed preferences only</p></div><button class="pause auto-switch" role="switch" aria-label="Automatic adjustments" aria-checked="true"><span></span></button></div><button class="line-action resume-open hide">Resume automatic adjustments…</button><div class="review hide"><p>Reuse confirmed preferences while this Mac is awake. This ends any manual hold; unfamiliar light is left alone.</p><div class="review-actions"><button class="key resume">Turn on</button><button class="cancel-review">Cancel</button></div></div></section>
<details class="learning-details"><summary>Learning details <span class="memory-count">3 remembered</span></summary><div><p>Comfortable saves a preference for similar room light. Too dark and Too bright make one small adjustment; they do not confirm a preference.</p><p>Preferences stay on this Mac. Pausing keeps the current picture and leaves feedback available. Manual TV brightness changes take priority for one hour.</p><p>This Mac must be awake and connected. Movie mode and Adaptive Brightness are required. A fresh sensor reading is needed before feedback; high-brightness settings stay protected.</p><p>TV readings, the last background check, and sensor errors remain available here. Screen light can affect the sensor, and HDR detection is unverified.</p></div></details>
<details class="error-details hide"><summary>Error details</summary><p>The last write could not be verified. Refresh to read the current TV state.</p><button class="line-action dismiss-error">Dismiss error</button></details>
</div>

</section>
<section class="screen detail connection-view hide"><button class="back" data-view="remote">${icon('left')}Remote</button><h1>Connection</h1><p class="sub subtitle">Saved for this Mac user</p><div class="scroll"><h2 class="connection-title">TV connected</h2><p>Refresh reads status. Reconnect resets this TV’s ADB connection.</p><div class="connection-actions"><button class="key refresh">${icon('refresh')}Refresh</button><button class="key reconnect">Reconnect</button></div><div class="section"><p>The Mac and TV need to be on the same local network. Use the TV’s debugging address.</p><div class="formrow"><label for="${id}-address">ADB address</label><input id="${id}-address" value="tv.local:5555" spellcheck="false"></div><div class="formrow"><label for="${id}-mac">Wake MAC address</label><input id="${id}-mac" placeholder="AA:BB:CC:DD:EE:FF" spellcheck="false"></div><div class="formrow"><label for="${id}-broadcast">Broadcast address</label><input id="${id}-broadcast" placeholder="192.0.2.255" spellcheck="false"></div><p>Illustrative fields. Your saved addresses are never read by this mockup.</p></div></div><footer class="pinned"><p class="sub connection-receipt" role="status">Changes apply only when you save.</p><button class="key save">Save and reconnect</button><button class="cancel cancel-edits">Cancel edits</button></footer></section>
</div><div class="preview-tools"><span>Example state</span><button class="appearance">${dark?'Light':'Dark'} appearance</button><select aria-label="Simulated TV state"><option value="ready">After an adjustment</option><option value="learning">First use</option><option value="using">Using a preference</option><option value="paused">Paused</option><option value="hold">Manual hold</option><option value="stopped">Service stopped</option><option value="offline">TV unavailable</option><option value="error">Action failed</option><option value="recovery">Needs recovery</option></select></div>`;
document.getElementById('board').append(wrap);
const p=wrap.querySelector('.panel'),q=s=>p.querySelector(s);let view=initial,mode='ready',automatic=true,timer;
function show(next){if(view==='connection'&&next!=='connection')resetFields();view=next;wrap.classList.toggle('expanded',next!=='remote');p.querySelectorAll('.screen').forEach(e=>e.classList.add('hide'));q(next==='connection'?'.connection-view':'.'+next).classList.remove('hide');q('.menu').classList.add('hide');q('.power').setAttribute('aria-expanded','false')}
function resetFields(){q('input').value='tv.local:5555';p.querySelectorAll('input')[1].value='';p.querySelectorAll('input')[2].value=''}
function receipt(text,kind='check'){q('.receipt').innerHTML=icon(kind)+'<span>'+text+'</span>';q('.receipt').classList.toggle('error',kind==='warning')}
p.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>show(b.dataset.view));
p.querySelectorAll('[data-command]').forEach(b=>b.onclick=()=>{if(b.dataset.command==='Refresh status'){q('.menu').classList.add('hide');q('.power').setAttribute('aria-expanded','false');q('.remote-name span').innerHTML='<i></i>YouTube · connected';return}clearTimeout(timer);q('.menu').classList.add('hide');q('.power').setAttribute('aria-expanded','false');receipt('Sending '+b.dataset.command.toLowerCase()+'…','clock');timer=setTimeout(()=>{receipt(b.dataset.command==='Quit TV Remote'?'Quit preserved in the native app.':b.dataset.command+' sent');if(apps.includes(b.dataset.command)){q('.remote-name span').innerHTML='<i></i>'+b.dataset.command+' · connected';p.querySelectorAll('.appkey').forEach(k=>k.classList.toggle('current-app',k.dataset.command===b.dataset.command))}},500)});
q('.power').onclick=()=>{q('.menu').classList.toggle('hide');q('.power').setAttribute('aria-expanded',String(!q('.menu').classList.contains('hide')))};

let pictureBusy=false,canUndo=true,remembered=3,undoRemembered=3,pictureTimer;
const pictureCopy={
 ready:['Keep this picture?','Your last adjustment stays in place while you decide.'],
 learning:['How’s the picture?','Make a small adjustment, or remember the picture as it is.'],
 using:['Using your preference','Reusing a picture you marked Comfortable in similar room light.'],
 paused:['Automatic adjustments is paused','The current picture stays as it is. Feedback still works below.'],
 hold:['Your change comes first','You changed the TV brightness. Automatic adjustments is on hold for one hour.'],
 stopped:['The service has stopped','Your current picture is left alone. Resume to reuse preferences in the background.'],
 offline:['Waiting for the TV','Check the TV is on and connected, then Refresh. Your saved feedback stays here.'],
 error:['Change not confirmed','Refresh to check what took effect. Undo feedback can recover the last adjustment.'],
 recovery:['An adjustment needs recovery','The last picture change could not be confirmed. Undo feedback before making another adjustment.']
};
function setPictureReceipt(text,kind='check'){q('.picture-receipt').textContent=text;q('.result-icon').innerHTML=icon(kind);q('.picture-result').classList.toggle('action-error',kind==='warning')}
function applyPictureState(resetReceipt=false){
 const copy=pictureCopy[mode]||pictureCopy.ready;
 q('.picture-title').textContent=copy[0];q('.picture-detail').textContent=copy[1];
 p.querySelectorAll('.picture-action').forEach(k=>k.disabled=pictureBusy||['offline','recovery'].includes(mode));
 q('.pause').disabled=pictureBusy||mode==='recovery';q('.pause').setAttribute('aria-checked',String(automatic));
 q('.automatic-copy').textContent=mode==='recovery'?'Blocked until recovery':mode==='hold'?'On hold · manual change':mode==='stopped'?'Background service unavailable':automatic?'On · confirmed preferences only':'Off · current picture stays';
 q('.resume-open').classList.toggle('hide',!['hold','stopped'].includes(mode));q('.resume-open').disabled=pictureBusy;
 q('.resume').disabled=pictureBusy||['offline','recovery'].includes(mode);q('.picture-refresh').disabled=pictureBusy;
 q('.undo').classList.toggle('hide',!canUndo);q('.undo').disabled=pictureBusy||mode==='offline';
 q('.undo-note').textContent=!canUndo?'Your feedback stays on this Mac.':mode==='offline'?'Reconnect to the TV, then Refresh to undo.':'Reverses its picture adjustment only if the TV hasn’t changed since.';
 q('.memory-count').textContent=remembered?remembered+' remembered':'Nothing saved yet';
 q('.error-details').classList.toggle('hide',!['error','recovery'].includes(mode));
 q('.feedback-hint').textContent=mode==='recovery'?'Feedback is blocked until the change is recovered.':mode==='offline'?'Refresh after the TV reconnects.':'Comfortable remembers it for similar light.';
 if(resetReceipt){const text={ready:'Picture dimmed a little.',learning:'No feedback yet.',using:'A preference was reused.',paused:'Automatic adjustments paused.',hold:'Manual change respected.',stopped:'Current picture left alone.',offline:'TV status unavailable.',error:'Action could not be confirmed.',recovery:'Action could not be confirmed.'}[mode];setPictureReceipt(text||'Ready for feedback.',['error','recovery','offline'].includes(mode)?'warning':'check')}
}
function pictureAction(action){
 if(pictureBusy)return;if(['Too bright','Too dark','Comfortable'].includes(action)&&['offline','recovery'].includes(mode))return;
 if(action==='undo'&&(!canUndo||mode==='offline'))return;
 if(action==='resume'&&['offline','recovery'].includes(mode))return;
 const progress={'Too bright':'Making the picture a little dimmer…','Too dark':'Making the picture a little brighter…','Comfortable':'Remembering this picture…',undo:'Undoing your last feedback…',pause:'Pausing automatic adjustments…',resume:'Starting automatic adjustments…'};
 pictureBusy=true;setPictureReceipt(progress[action],'clock');applyPictureState();
 pictureTimer=setTimeout(()=>{
  pictureBusy=false;
  if(action==='pause'){automatic=false;mode='paused';setPictureReceipt('Automatic adjustments paused.')}
  else if(action==='resume'){automatic=true;mode=remembered?'using':'learning';setPictureReceipt('Automatic adjustments enabled.')}
  else if(action==='undo'){remembered=undoRemembered;canUndo=false;mode=automatic?(remembered?'using':'learning'):'paused';setPictureReceipt('Last feedback removed.')}
  else if(action==='Comfortable'){undoRemembered=remembered;remembered=Math.max(1,remembered);canUndo=true;mode=automatic?'using':'paused';setPictureReceipt('Preference remembered.')}
  else{undoRemembered=remembered;canUndo=true;mode=automatic?'ready':'paused';setPictureReceipt(action==='Too bright'?'Picture dimmed a little.':'Picture brightened a little.')}
  applyPictureState();
 },550)
}
p.querySelectorAll('[data-picture]').forEach(k=>k.onclick=()=>pictureAction(k.dataset.picture));
q('.undo').onclick=()=>pictureAction('undo');
q('.pause').onclick=()=>{if(automatic)pictureAction('pause');else q('.review').classList.toggle('hide')};
q('.resume-open').onclick=()=>q('.review').classList.toggle('hide');
q('.resume').onclick=()=>{q('.review').classList.add('hide');pictureAction('resume')};q('.cancel-review').onclick=()=>q('.review').classList.add('hide');
q('.picture-refresh').onclick=()=>{q('.refresh-status').textContent=mode==='offline'?'TV unavailable':'Status read just now';q('.refresh-status').classList.toggle('error-text',mode==='offline')};
q('.dismiss-error').onclick=()=>{mode='ready';q('.error-details').open=false;applyPictureState(true)};
q('.refresh').onclick=()=>q('.connection-receipt').textContent='Status read. No TV settings changed.';
q('.reconnect').onclick=()=>q('.connection-receipt').textContent='Reconnected (simulation).';
q('.save').onclick=()=>{const address=q('input').value,valid=/^[^\s:]+:\d+$/.test(address)&&+address.split(':')[1]>0&&+address.split(':')[1]<65536;q('.connection-receipt').textContent=valid?'Mockup only. Saved settings are unchanged.':'Use host:port, with a port from 1 to 65535.';q('.connection-receipt').classList.toggle('error-text',!valid)};
q('.cancel-edits').onclick=()=>{resetFields();q('.connection-receipt').textContent='Changes apply only when you save.';show('remote')};
wrap.querySelector('.appearance').onclick=e=>{p.classList.toggle('dark');e.currentTarget.textContent=(p.classList.contains('dark')?'Light':'Dark')+' appearance'};
wrap.querySelector('select').onchange=e=>{
 clearTimeout(timer);clearTimeout(pictureTimer);pictureBusy=false;mode=e.target.value;automatic=!['paused','recovery'].includes(mode);canUndo=!['learning','using','stopped'].includes(mode);remembered=mode==='learning'?0:3;undoRemembered=remembered;
 q('.review').classList.add('hide');
 p.querySelectorAll('.control').forEach(k=>k.disabled=mode==='offline');
 q('.status span').textContent=mode==='offline'?'Disconnected · Check Connection':'TV on · YouTube';
 q('.connection-title').textContent=mode==='offline'?'Cannot connect to TV':'TV connected';
 applyPictureState(true)
};
p.addEventListener('keydown',e=>{if(view!=='remote'||e.target.matches('input,select')||e.metaKey||e.ctrlKey||e.altKey)return;if(e.target.matches('button')&&['Enter',' '].includes(e.key))return;const map={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',Enter:'Select',' ':'Play / pause',Escape:'Back'};if(map[e.key]){e.preventDefault();q('[data-command="'+map[e.key]+'"]').click()}});

const surface=q('.pad');let origin=null,suppressUntil=0;
surface.querySelectorAll('button[data-command]').forEach(key=>{key.addEventListener('pointerenter',()=>{surface.dataset.focus=key.dataset.command;surface.querySelector('.surface-hint').textContent=key.dataset.command==='Select'?'Select':key.dataset.command[0].toUpperCase()+key.dataset.command.slice(1)});key.addEventListener('pointerleave',()=>{delete surface.dataset.focus;surface.querySelector('.surface-hint').textContent='Navigate'})});

surface.addEventListener('pointerup',e=>{if(!origin||mode==='offline')return;const dx=e.clientX-origin.x,dy=e.clientY-origin.y;origin=null;if(Math.max(Math.abs(dx),Math.abs(dy))<26)return;const direction=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');suppressUntil=Date.now()+250;surface.dataset.focus=direction;q('[data-command="'+direction+'"]').click();surface.querySelector('.surface-hint').textContent=direction[0].toUpperCase()+direction.slice(1)});
surface.addEventListener('pointercancel',()=>origin=null);surface.addEventListener('pointerleave',()=>origin=null);surface.addEventListener('click',e=>{if(e.detail>0&&Date.now()<suppressUntil){e.preventDefault();e.stopImmediatePropagation()}},true);

applyPictureState(true);show(initial);return p;
}
panel('remote-study',false,'picture');panel('graphite-study',true,'picture');
console.log('Simulated layout only. No network, TV commands, preferences, or controller changes.');
