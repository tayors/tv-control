document.getElementById('board').append(wrap);
const p=wrap.querySelector('.panel'),q=s=>p.querySelector(s);let view=initial,mode='ready',automatic=true,timer;
function show(next){if(view==='connection'&&next!=='connection')resetFields();view=next;wrap.classList.toggle('expanded',next!=='remote');p.querySelectorAll('.screen').forEach(e=>e.classList.add('hide'));q(next==='connection'?'.connection-view':'.'+next).classList.remove('hide');q('.menu').classList.add('hide');q('.power').setAttribute('aria-expanded','false')}
function resetFields(){q('input').value='tv.local:5555';p.querySelectorAll('input')[1].value='';p.querySelectorAll('input')[2].value=''}
function receipt(text,kind='check'){q('.receipt').innerHTML=icon(kind)+'<span>'+text+'</span>';q('.receipt').classList.toggle('error',kind==='warning')}
p.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>show(b.dataset.view));
p.querySelectorAll('[data-command]').forEach(b=>b.onclick=()=>{if(b.dataset.command==='Refresh status'){q('.menu').classList.add('hide');q('.power').setAttribute('aria-expanded','false');q('.remote-name span').innerHTML='<i></i>Status refreshed';return}clearTimeout(timer);q('.menu').classList.add('hide');q('.power').setAttribute('aria-expanded','false');receipt('Sending '+b.dataset.command.toLowerCase()+'…','clock');timer=setTimeout(()=>receipt(b.dataset.command==='Quit TV Remote'?'Quit preserved in the native app.':b.dataset.command+' sent'),500)});
q('.power').onclick=()=>{q('.menu').classList.toggle('hide');q('.power').setAttribute('aria-expanded',String(!q('.menu').classList.contains('hide')))};
p.querySelectorAll('[data-picture]').forEach(b=>b.onclick=()=>{q('.picture-receipt').textContent={'Too bright':'Picture adjusted a little dimmer.','Too dark':'Picture adjusted a little brighter.','Comfortable':'Remembered for similar room light.'}[b.dataset.picture];q('.undo').classList.remove('hide')});
q('.undo').onclick=()=>{q('.picture-receipt').textContent='Last feedback undone.';q('.undo').classList.add('hide');if(mode==='recovery'){mode='ready';wrap.querySelector('select').value='ready';p.querySelectorAll('.picture-action').forEach(b=>b.disabled=false);q('.learning-state span').textContent='Waiting for your feedback';q('.picture-detail').textContent='Make a small adjustment, or remember the picture as it is.'}};
q('.pause').onclick=()=>{if(automatic){automatic=false;q('.automatic-copy').textContent='Paused. The current picture stays as it is. Feedback still works.';q('.pause').textContent='Turn on automatic adjustments…';q('.picture-receipt').textContent='Automatic adjustments paused.'}else q('.review').classList.toggle('hide')};
q('.resume').onclick=()=>{automatic=true;q('.review').classList.add('hide');q('.pause').textContent='Pause automatic adjustments';q('.automatic-copy').textContent='Reuse your confirmed choices in similar room light. Leave unfamiliar light alone.';q('.picture-receipt').textContent='Automatic adjustments resumed.'};q('.cancel-review').onclick=()=>q('.review').classList.add('hide');
q('.picture-refresh').onclick=()=>q('.picture-detail').textContent=mode==='offline'?'Cannot read the TV. Check Connection, then Refresh.':'Status refreshed. Your latest feedback and Undo are preserved.';
q('.refresh').onclick=()=>q('.connection-receipt').textContent='Status read. No TV settings changed.';
q('.reconnect').onclick=()=>q('.connection-receipt').textContent='Reconnected (simulation).';
q('.save').onclick=()=>{const address=q('input').value,valid=/^[^\s:]+:\d+$/.test(address)&&+address.split(':')[1]>0&&+address.split(':')[1]<65536;q('.connection-receipt').textContent=valid?'Mockup only. Saved settings are unchanged.':'Use host:port, with a port from 1 to 65535.';q('.connection-receipt').classList.toggle('error-text',!valid)};
q('.cancel-edits').onclick=()=>{resetFields();q('.connection-receipt').textContent='Changes apply only when you save.';show('remote')};
wrap.querySelector('.appearance').onclick=e=>{p.classList.toggle('dark');e.currentTarget.textContent=(p.classList.contains('dark')?'Light':'Dark')+' appearance'};
wrap.querySelector('select').onchange=e=>{clearTimeout(timer);mode=e.target.value;const offline=mode==='offline';p.querySelectorAll('.control').forEach(b=>b.disabled=offline);p.querySelectorAll('.picture-action').forEach(b=>b.disabled=offline||mode==='recovery');q('.undo').disabled=offline;q('.resume').disabled=offline||mode==='recovery';q('.status span').textContent=offline?'Disconnected · Check Connection':'TV on · YouTube';q('.connection-title').textContent=offline?'Cannot connect to TV':'TV connected';if(offline)receipt('TV unavailable. Open Connection.','warning');else if(mode==='error')receipt('Action failed. Check Connection.','warning');else receipt('Ready · YouTube');if(mode==='recovery'){show('picture');q('.undo').classList.remove('hide');q('.learning-state span').textContent='An adjustment needs recovery';q('.picture-detail').textContent='The last change could not be confirmed. Automatic changes are blocked. Undo last feedback to recover.';q('.picture-receipt').textContent='Action could not be confirmed.'}};
p.addEventListener('keydown',e=>{if(view!=='remote'||e.target.matches('input,select')||e.metaKey||e.ctrlKey||e.altKey)return;if(e.target.matches('button')&&['Enter',' '].includes(e.key))return;const map={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',Enter:'Select',' ':'Play / pause',Escape:'Back'};if(map[e.key]){e.preventDefault();q('[data-command="'+map[e.key]+'"]').click()}});
show(initial);return p;
}
panel('remote-study',true,'remote');panel('silver-study',false,'remote');
console.log('Simulated layout only. No network, TV commands, preferences, or controller changes.');
</script>
</html>
